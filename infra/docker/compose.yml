# Local infrastructure for development and manual testing.
# Usage (from the repo root):
#   cp infra/docker/.env.example infra/docker/.env
#   docker compose -f infra/docker/compose.yml up -d
#
# Ports are bound to 127.0.0.1 only, so nothing is exposed to the local network.
# Image versions are pinned and at least 7 days old (same rule as pnpm's minimumReleaseAge).

name: meshdex

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set in infra/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in infra/docker/.env}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:?set in infra/docker/.env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set in infra/docker/.env}
      ML_DB_PASSWORD: ${ML_DB_PASSWORD:?set in infra/docker/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/ — mount the parent.
      - postgres-data:/var/lib/postgresql
      # Runs only when the data volume is empty (first start).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      # Two listeners: `internal` for containers on the compose network,
      # `external` for services running on the host (pnpm dev).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_EXTERNAL_PORT:-19092}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - '127.0.0.1:${KAFKA_EXTERNAL_PORT:-19092}:19092'
      - '127.0.0.1:${REDPANDA_ADMIN_PORT:-9644}:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: redpandadata/console:v3.13.1
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - '127.0.0.1:${REDPANDA_CONSOLE_PORT:-8088}:8080'
    depends_on:
      redpanda:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in infra/docker/.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in infra/docker/.env}
      S3_BUCKET: ${S3_BUCKET:-meshdex-assets}
    # The S3 identity file is generated from env at start, so no credentials live in the repo.
    # "anonymous" applies to requests without credentials: it may only read the bucket's
    # public/ prefix (ADR 017), the local stand-in for CloudFront in front of public/*.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"meshdex-dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:%s/public/*"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" "$$S3_BUCKET" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot job: creates the bucket and its CORS rules, then exits.
  s3-init:
    image: amazon/aws-cli:2.39.4
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in infra/docker/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in infra/docker/.env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-meshdex-assets}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    entrypoint: ['/bin/sh', '/scripts/init.sh']
    volumes:
      - ./s3:/scripts:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
  redpanda-data:
  seaweedfs-data:
